# This ini file can be used with the checkbump tool described in
# http://rafaelmartins.eng.br/en-us/post/version-bump-checker/ and
# found in
# http://git.overlays.gentoo.org/gitweb/?p=proj/checkbump.git;a=summary.
# It generates a HTML page which shows packages that need a version
# bump in the Portage tree.

[app-accessibility/emacspeak]
url = http://code.google.com/p/emacspeak/downloads/list
command = grep 'emacspeak-\([0-9.-]\+\)\.tar\.bz2' | sed -e 's/.*emacspeak-\([0-9.-]\+\)\.tar\.bz2.*/\1/' -e 's/-/./' | sort --version-sort | tail -n 1

[app-doc/casting-spels-emacs]
url = http://code.google.com/p/casting-spels-emacs/downloads/list
command = grep 'casting-spels-emacs-v\([0-9.-]\+\)\.zip' | sed -e 's/.*casting-spels-emacs-v\([0-9.-]\+\)\.zip.*/\1/' -e 's/-/./' | sort --version-sort | tail -n 1

